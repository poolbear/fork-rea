name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午 8 点自动保底同步
  workflow_dispatch:     # 保持手动触发能力

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync Latest Commits, Tags, and Releases

    steps:
    # 第一步：必须完整检出你自己的仓库
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # 第二步：使用专门的高级同步工具（自带有冲突处理和全数据对齐能力）
    - name: Sync Upstream
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
      with:
        target_sync_branch: main        # 你的主分支名
        target_repo_token: ${{ secrets.GITHUB_TOKEN }}
        upstream_sync_branch: main      # 原作者的主分支名
        upstream_sync_repo: morluto/rea # 替换为你想同步的原仓库「作者/项目名」
        
        # 核心关键参数：即使原作者更新了他们自己的 workflows，也绝对不让它们触发或影响你
        # 它会在同步的同时，保持你本地的 Actions 配置不被篡改
        test_mode: false

    # 3. 回复自己的 workflows 目录
    - name: Restore Own Workflows Directory
      if: always()
      run: |
        # 将工作流目录重置回同步前的状态
        git checkout HEAD -- .github/workflows/
        # 如果上游新增了工作流文件，需要将其删除
        git clean -fd .github/workflows/
        # 检查是否有待提交的变更（通常不会有，除非你本地也有修改）
        if ! git diff --quiet HEAD -- .github/workflows/; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: restore local workflows after upstream sync"
          git push origin HEAD:${{ github.ref }}
        fi

    # 第四步：强制将拉取到的新 Tags 推送到你的仓库（确保 Releases 完美同步）
    - name: Sync and Push Tags
      run: |
        UPSTREAM="morluto/rea"
        git remote add upstream_tags "https://github.com/${UPSTREAM}.git" || true
        git fetch upstream_tags --tags
        git push origin --tags --force
