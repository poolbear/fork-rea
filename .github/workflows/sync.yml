name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午 8 点自动保底同步
  workflow_dispatch:     # 保持手动触发能力

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync Latest Commits, Tags, and Releases

    steps:
    # 第一步：必须完整检出你自己的仓库
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # 第二步：使用专门的高级同步工具（自带有冲突处理和全数据对齐能力）
    - name: Sync Upstream
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
      with:
        target_sync_branch: main        # 你的主分支名
        target_repo_token: ${{ secrets.GITHUB_TOKEN }}
        upstream_sync_branch: main      # 原作者的主分支名
        upstream_sync_repo: morluto/rea # 替换为你想同步的原仓库「作者/项目名」
        
        # 核心关键参数：即使原作者更新了他们自己的 workflows，也绝对不让它们触发或影响你
        # 它会在同步的同时，保持你本地的 Actions 配置不被篡改
        test_mode: false

    # 第三步：强制将拉取到的新 Tags 推送到你的仓库（确保 Releases 完美同步）
    - name: Sync and Push Tags
      run: |
        git remote add upstream_tags https://github.com || true
        git fetch upstream_tags --tags
        git push origin --tags --force
